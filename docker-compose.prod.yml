services:
  # ==============================================================================
  # Database: PostgreSQL 16 with PostGIS Geospatial Engine
  # ==============================================================================
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: bhoomistack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhoomistack
      POSTGRES_USER: ${DB_USER:-bhoomi_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bhoomi_admin} -d bhoomistack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhoomi-internal

  # ==============================================================================
  # Backend API: FastAPI + Gunicorn ASGI Workers
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomistack-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-bhoomi_admin}:${DB_PASSWORD}@db:5432/bhoomistack
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: 8
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://yourdomain.in}
      WORKERS: ${BACKEND_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bhoomi-internal

  # ==============================================================================
  # Frontend: Production Nginx serving React SPA & Reverse Proxy
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomistack-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bhoomi-internal

networks:
  bhoomi-internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
