# ============================================================
# BhoomiStack — Nginx Production Configuration
# HTTPS-first, security-hardened, performance-optimized
# ============================================================

# HTTP → HTTPS redirect (Item 4: Force HTTPS)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bhoomistack.gov.in www.bhoomistack.gov.in _;

    # ---- SSL/TLS (provide actual certs via volume mount or Cloudflare) ----
    # ssl_certificate     /etc/ssl/certs/bhoomistack.crt;
    # ssl_certificate_key /etc/ssl/private/bhoomistack.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip Compression (Item 11: Compress images/assets) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # ---- Security Headers (DPDPA / CERT-In compliance) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: http:; worker-src 'self' blob:;" always;

    # ---- Static Assets Cache (images, fonts, JS bundles) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Cache images specifically (Item 11: image compression at delivery)
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Vary "Accept-Encoding";
    }

    # Cache fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ---- Proxy API requests to backend ----
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- SPA routing (React Router fallback) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Serve sitemap and robots at root ----
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        add_header Content-Type "application/xml";
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Content-Type "text/plain";
    }

    # ---- Healthcheck probe ----
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type "text/plain";
    }
}
